<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ゼロから始める資産形成ロードマップ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --coral:    #d9724a;
    --coral-dp: #b85a37;
    --gold:     #e8c25a;
    --cream:    #fbf2e4;
    --cream2:   #fdf8ef;
    --navy:     #33302e;
    --text:     #4a453f;
    --soft:     #8a8378;
    --border:   #ece2d3;
  }

  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'ヒラギノ角ゴシック ProN', 'Hiragino Sans', sans-serif;
    color: var(--navy);
    background: linear-gradient(160deg, var(--cream) 0%, var(--cream2) 100%);
    min-height: 100vh;
    line-height: 1.8;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 20px;
    max-width: 440px;
    width: 100%;
    padding: 40px 28px 32px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
  }

  .badge {
    display: inline-block;
    background: #fff;
    border: 1px solid var(--border);
    color: var(--coral-dp);
    font-size: 12.5px; font-weight: 700; letter-spacing: 0.08em;
    padding: 7px 20px; border-radius: 30px; margin-bottom: 22px;
  }

  h1 {
    font-size: clamp(19px, 5.2vw, 23px);
    font-weight: 800;
    line-height: 1.6;
    color: var(--navy);
    margin-bottom: 10px;
  }

  .sub {
    font-size: 14.5px;
    color: var(--text);
    margin-bottom: 28px;
    line-height: 1.9;
  }

  .cta-btn {
    display: block;
    width: 100%;
    background: linear-gradient(135deg, var(--coral), var(--coral-dp));
    color: #fff;
    font-size: 16px; font-weight: 800; letter-spacing: 0.03em;
    padding: 18px 20px;
    border-radius: 50px;
    text-decoration: none;
    box-shadow: 0 6px 20px rgba(217,114,74,0.4);
  }

  .note {
    font-size: 12px;
    color: var(--soft);
    margin-top: 16px;
    line-height: 1.7;
  }
</style>
</head>
<body>

<div class="card">
  <p class="badge">登録ありがとうございます</p>
  <h1>ゼロから始める<br>資産形成ロードマップ</h1>
  <p class="sub">スキルより先に、"マインド"と"地図"を手に入れる。<br>下のボタンからご覧いただけます。</p>
  <a class="cta-btn" href="ゼロから始める資産形成ロードマップ.pdf" target="_blank">ガイドを見る（PDF）</a>
  <p class="note">タップするとPDFが開きます。うまく開かない場合は、リンクを長押しして「リンク先を開く」を選んでください。</p>
</div>

</body>
</html>
